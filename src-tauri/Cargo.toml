[package]
name = "frieren-pet"
version = "0.1.0"
description = "A simplified desktop pet (Tauri 2 + Vue 3), architecture references BongoCat"
authors = ["jcbl1"]
edition = "2021"

[lib]
name = "frieren_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-pinia = "3"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target."cfg(target_os = \"macos\")".dependencies]
tauri-nspanel = { path = "../vendor/tauri-nspanel" }
