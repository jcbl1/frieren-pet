[package]
name = "frieren-pet"
version = "0.1.0"
description = "A simplified desktop pet (Tauri 2 + Vue 3), architecture references BongoCat"
authors = ["jcbl1"]
edition = "2021"

[lib]
name = "frieren_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-pinia = "3"
tauri-plugin-single-instance = "2"
fs_extra = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target."cfg(target_os = \"macos\")".dependencies]
tauri-nspanel = { path = "../vendor/tauri-nspanel" }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.1"
